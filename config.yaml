# 6. 원본 칼럼 변수  (계획서 4-2 ③ 확장)
#    원본의 중·소분류, 지역 칼럼으로 만드는 변수. 지역은 R001 같은 코드로만 다룸
# ----------------------------------------------------------------
원본변수:
  중분류_요약:   { 처음값: 끄기, 시험: 예 }   # 중분류 집중도(HHI), 1위 중분류 비중, 전월보다 늘어난 중분류 비율
  중분류_분해:   { 처음값: 끄기, 시험: 예 }   # 업종 안 상위 N개 중분류의 금액 비중·전월대비
  소분류_요약:   { 처음값: 끄기, 시험: 예 }   # 위 요약 3개를 소분류 기준으로
  지역_요약:     { 처음값: 끄기, 시험: 예 }   # 타 시도 결제 비중, 가맹점·고객 지역 집중도, 1위 지역 비중
  지역_분해:     { 처음값: 끄기, 시험: 예 }   # 전체 금액 상위 N개 지역의 금액 비중·전월대비
  원본행수:      { 처음값: 끄기, 시험: 예 }   # 원본 행 수 (거래 조합의 다양성)
  지역_단위:
    설명: 시도 = 17개 시도 / 세부 = 수도권(서울·경기·인천)만 시군구, 나머지는 시도 (명세서상 비수도권은 시도로 묶여 있음)
    처음값: 시도
    선택지: [시도, 세부]
    시험: 예
  상위지역_수: 5           # 지역 분해 변수에 쓸 지역 수 (1~5월 금액 상위)
  상위중분류_수: 3         # 중분류 분해 변수에 쓸 업종 안 중분류 수 (1~5월 금액 상위)
  최소_월평균건수: 100     # 분해 칸의 월평균 결제건수가 이보다 적으면 '기타'로 합침 (계획서 4-2 ③)


# ----------------------------------------------------------------
# 7. 소분류 묶음 처리  — 에이전트가 묶음을 직접 만듦
#    제외 = 묶음 거래를 빼고 변수 계산 / 분리 = 빼고 계산한 뒤 묶음 금액을 별도 변수로 추가
#    정답(다음 달 증가/감소)은 묶음과 상관없이 항상 원본 전체로 계산 (고정)
# ----------------------------------------------------------------
소분류처리:
  묶음_최대: 3
  변동주도_기준: 0.3       # 1~5월, 같은 대분류 안 소분류들의 월 변화량 중 이 비율 이상을 만든 소분류는 '변동 주도' 후보
  힌트:                    # 에이전트에게 주는 참고 목록 (따를 의무 없음). '대 > 중 > 소' 형식
    비소비성:
      - 교육/교양/서비스 > 서비스 > 국세/지방세
      - 교육/교양/서비스 > 서비스 > 공과금
      - 교육/교양/서비스 > 서비스 > 통신비(시청료)
      - 교육/교양/서비스 > 서비스 > 비영리단체(기관)
      - 의료/보험/위생 > 보험 > 보험
    본사집계의심:
      - 교육/교양/서비스 > 서비스 > 국세/지방세
      - 유통 > 유통업 > 연쇄점
      - 교육/교양/서비스 > 서비스 > 공과금
      - 교육/교양/서비스 > 서비스 > 대여전문업(도서/웨딩/의상)
      - 숙박/여행 > 렌터카 > 렌터카
      - 교육/교양/서비스 > 서비스 > 출판업
      - 숙박/여행 > 여행/교통 > 철도
      - 교육/교양/서비스 > 취미교양용품 > 상품권
      - 숙박/여행 > 여행/교통 > 여행사
      - 숙박/여행 > 여행/교통 > 항공사
      - 자동차/주유소 > 자동차판매 > 자동차판매
      - 교육/교양/서비스 > 종합교육관련상품 > 교육/과학기자재
      - 교육/교양/서비스 > 서비스 > 비영리단체(기관)
      - 의료/보험/위생 > 의료기관 > 성형외과
      - 의료/보험/위생 > 보험 > 보험
      - 교육/교양/서비스 > 서비스 > 통신비(시청료)
      - 유통 > 유통업 > 면세점


# ----------------------------------------------------------------
# 8. 전처리  (계획서 3-2, 3-5, 4-2 ④)
# ----------------------------------------------------------------
전처리:
  금액_로그변환:
    설명: 금액 단위 차이가 커서 sign(x)·log(1+|x|)로 크기를 줄임
    처음값: 켜기
    선택지: [켜기, 끄기]
    시험: 아니오
  극단값_상한:
    설명: 학습 문제의 상·하위 1%를 넘는 변수 값을 그 값으로 자름 (정답은 건드리지 않음)
    처음값: 켜기
    선택지: [켜기, 끄기]
    시험: 예
  고객층_표현:
    설명: 성별과 연령구간을 따로 표시할지, 합쳐서 고객층 6개 중 하나로 표시할지
    처음값: 따로
    선택지: [따로, 합침]
    시험: 예
  미세변동_제외:
    설명: 전월 대비 ±2% 이내로 변한 문제를 학습에서만 뺌. 검증·테스트는 전부 채점 (계획서 4-2 ④)
    처음값: 끄기
    선택지: [끄기, 켜기]
    시험: 예


# ----------------------------------------------------------------
# 9. 후보 모델  (계획서 4-1 확장)
#    사용: 아니오 로 바꾸면 그 모델은 건너뜀
#    표준화_필요: 예 = 변수마다 평균 0, 표준편차 1로 맞춘 뒤 학습 (거리·경계·선형·신경망 모델)
#    고정설정 = 탐색하지 않고 항상 쓰는 값
#    좁은범위 = 탐색방법이 grid 일 때 전부 시험하는 값
#    넓은범위 = 탐색방법이 optuna 일 때 이 [최소, 최대] 안에서 탐색
# ----------------------------------------------------------------
비교용_규칙:     # 모델이 최소한 이것보다는 잘 맞혀야 함. 항상 실행
  다수방향:     학습 기간에 더 많았던 방향(증가 또는 감소)으로 전부 예측
  직전방향유지: 지난달 늘었으면 다음 달도 늘 것으로 예측

기준모델: 로지스틱회귀     # 다른 모델은 이 모델을 채택 규칙으로 이겨야만 선택됨

후보모델:
  로지스틱회귀:
    사용: 예
    설명: 변수마다 증가 쪽으로 미는 힘(계수)을 더해 확률을 냄. 해석이 쉬운 기준 모델 (계획서 baseline)
    표준화_필요: 예
    고정설정: { class_weight: balanced, max_iter: 5000 }
    좁은범위: { C: [0.01, 0.1, 1, 10] }
    넓은범위: { C: [0.0001, 100] }

  로지스틱_L1:
    사용: 예
    설명: 로지스틱과 같되 쓸모없는 변수의 힘을 0으로 만들어 변수를 골라 줌
    표준화_필요: 예
    고정설정: { class_weight: balanced, solver: saga, max_iter: 5000 }
    좁은범위: { C: [0.1, 1, 10], l1_ratio: [0.5, 1.0] }
    넓은범위: { C: [0.001, 100], l1_ratio: [0.1, 1.0] }

  선형판별분석:
    사용: 예
    설명: 증가·감소 두 무리의 평균 차이로 가름. 매우 단순하고 작은 표본에 강함
    표준화_필요: 예
    고정설정: { solver: lsqr }
    좁은범위: { shrinkage: [auto, 0.5] }
    넓은범위: { shrinkage: [0.0, 1.0] }

  SGD:
    사용: 예
    설명: 새 달 데이터만으로 조금씩 고쳐 쓸 수 있는 모델. 월별 순차 갱신 실험에 사용 (계획서 5-3)
    표준화_필요: 예
    고정설정: { loss: log_loss, learning_rate: adaptive, class_weight: balanced, max_iter: 2000 }
    좁은범위: { alpha: [0.0001, 0.001, 0.01], eta0: [0.001, 0.01] }
    넓은범위: { alpha: [0.00001, 0.1], eta0: [0.0001, 0.1] }

  나이브베이즈:
    사용: 예
    설명: 변수들이 서로 독립이라고 보고 확률을 곱함. 가장 단순한 확률 모델
    표준화_필요: 아니오
    고정설정: {}
    좁은범위: { var_smoothing: [0.000000001] }
    넓은범위: { var_smoothing: [0.000000000001, 0.001] }

  최근접이웃:
    사용: 예
    설명: 과거에 가장 비슷했던 k개 사례의 다수결
    표준화_필요: 예
    고정설정: {}
    좁은범위: { n_neighbors: [5, 15, 30], weights: [uniform, distance] }
    넓은범위: { n_neighbors: [3, 60] }

  서포트벡터머신:
    사용: 예
    설명: 두 무리를 가장 넓은 간격으로 나누는 곡선 경계. 확률은 보정해서 출력
    표준화_필요: 예
    고정설정: { class_weight: balanced }
    좁은범위: { C: [0.1, 1, 10], gamma: [scale, 0.01] }
    넓은범위: { C: [0.01, 100], gamma: [0.0001, 1.0] }

  결정나무:
    사용: 예
    설명: 예/아니오 질문 몇 단계로 가름. 규칙을 그대로 읽을 수 있음
    표준화_필요: 아니오
    고정설정: { class_weight: balanced }
    좁은범위: { max_depth: [2, 3, 5], min_samples_leaf: [10, 20] }
    넓은범위: { max_depth: [2, 8], min_samples_leaf: [5, 50] }

  랜덤포레스트:
    사용: 예
    설명: 예/아니오 질문 나무 수백 그루의 다수결. 변수 사이의 복잡한 관계를 잡음 (계획서 비교 모델)
    표준화_필요: 아니오
    고정설정: { class_weight: balanced }
    좁은범위: { n_estimators: [200, 500], max_depth: [3, 5, 8], min_samples_leaf: [5, 10, 20] }
    넓은범위: { n_estimators: [50, 1000], max_depth: [2, 10], min_samples_leaf: [1, 50] }

  엑스트라트리:
    사용: 예
    설명: 랜덤포레스트보다 더 무작위로 나눠 과적합이 적음
    표준화_필요: 아니오
    고정설정: { class_weight: balanced, n_estimators: 300 }
    좁은범위: { max_depth: [3, 5, 8], min_samples_leaf: [5, 10, 20] }
    넓은범위: { max_depth: [2, 10], min_samples_leaf: [1, 50] }

  LightGBM:
    사용: 예
    설명: 앞 나무가 틀린 것을 다음 나무가 고쳐 가는 방식. 변수 간 상호작용을 잡음 (계획서 비교 모델)
    표준화_필요: 아니오
    고정설정: { n_estimators: 200, class_weight: balanced, verbose: -1 }
    좁은범위: { num_leaves: [7, 15], learning_rate: [0.03, 0.1], min_child_samples: [10, 20] }
    넓은범위: { num_leaves: [4, 31], learning_rate: [0.005, 0.3], min_child_samples: [5, 50] }

  히스트그래디언트부스팅:
    사용: 예
    설명: LightGBM과 같은 방식을 scikit-learn으로 구현. 추가 설치 불필요
    표준화_필요: 아니오
    고정설정: { max_iter: 200, class_weight: balanced }
    좁은범위: { max_leaf_nodes: [7, 15], learning_rate: [0.03, 0.1], min_samples_leaf: [10, 20] }
    넓은범위: { max_leaf_nodes: [4, 31], learning_rate: [0.005, 0.3], min_samples_leaf: [5, 50] }

  신경망:
    사용: 예
    설명: 작은 인공신경망 (은닉층 1개). 표본이 작아 강한 규제만 시험
    표준화_필요: 예
    고정설정: { max_iter: 5000 }
    좁은범위: { hidden_layer_sizes: [8, 16], alpha: [0.01, 0.1, 1.0] }
    넓은범위: { hidden_layer_sizes: [4, 32], alpha: [0.0001, 10.0] }

  중분류합산:
    사용: 아니오            # 실데이터 검증에서 로지스틱보다 낮아 기본은 끔 (docs/0.7_탐색기록.md)
    설명: >-
      대분류 방향을 바로 맞히지 않고, 중분류마다 '다음 달 금액 변화 ÷ 이번 달 대분류 금액'을 회귀 모델로 예측해
      더한 뒤 그 부호로 증가/감소를 정함 (계획서 4-2 ③). 학습 칸이 중분류 수만큼 늘어남.
      1~5월 월평균 결제건수가 '원본변수 > 최소_월평균건수' 미만인 중분류는 대분류 안의 '(기타)'로 합침
    표준화_필요: 아니오     # 모델 안에서 중분류 칸 기준으로 처리
    고정설정: {}
    좁은범위: { 회귀모델: [릿지, LightGBM, 랜덤포레스트], 복잡도: [낮음, 중간, 높음] }
    넓은범위: {}            # 고를 수 있는 값은 위 목록뿐 (낮음·중간·높음의 실제 숫자는 agents/bottomup.py)

  달력방향:
    사용: 예
    설명: >-
      다음 달이 이번 달보다 긴지(일수 또는 영업일수)만 보고 방향을 정함. 학습 기간에서 '더 긴 달 / 아닌 달'마다
      증가 비율을 세어 그대로 증가확률로 씀. 같은 달 문제는 모두 같은 답 (정답이 월 합계라 달 길이 영향이 큼)
    표준화_필요: 아니오
    고정설정: {}
    좁은범위: { 기준: [일수, 영업일수] }
    넓은범위: {}

  칼만상태공간:
    사용: 예
    설명: >-
      칸(고객층×업종)마다 하루 평균 지출을 숨은 상태로 보고 칼만필터로 매달 갱신. 다음 달 합계 = 하루 평균 예측 × 다음 달 일수.
      모형 수준/수준추세/공통요인(48칸 공통 흐름 + 칸별 차이). 신호대잡음비가 클수록 새 달에 빨리 따라감.
      보정 부호(예측 변화의 부호) / 로지스틱(학습 기간 정답으로 증가확률을 맞춤)
    표준화_필요: 아니오
    고정설정: {}
    좁은범위: { 모형: [수준, 수준추세, 공통요인], 신호대잡음비: [0.3, 3.0], 보정: [부호, 로지스틱] }
    넓은범위: { 신호대잡음비: [0.01, 100.0] }

  시변계수회귀:
    사용: 예
    설명: 변수 → 다음 달 증감률의 계수가 매달 조금씩 변한다고 보고 칼만필터로 계수를 추적 (같은 달 안의 관계가 달마다 바뀌는 문제 대응)
    표준화_필요: 아니오
    고정설정: {}
    좁은범위: { 변화속도: [0.01, 0.1, 1.0] }
    넓은범위: { 변화속도: [0.0001, 10.0] }

  최근가중로지스틱:
    사용: 예
    설명: 연속학습. 로지스틱 회귀에 최근 달일수록 큰 가중치 (한 달 전 × 망각계수, 두 달 전 × 망각계수² ...)
    표준화_필요: 아니오
    고정설정: {}
    좁은범위: { C: [0.01, 0.1, 1.0], 망각계수: [0.5, 0.8] }
    넓은범위: { C: [0.0001, 100.0], 망각계수: [0.1, 1.0] }

  XGBoost:
    사용: 아니오           # 설치 필요 (pip install xgboost)
    설명: 부스팅 계열의 다른 구현
    표준화_필요: 아니오
    고정설정: { n_estimators: 200, verbosity: 0 }
    좁은범위: { max_depth: [2, 4], learning_rate: [0.03, 0.1] }
    넓은범위: { max_depth: [2, 8], learning_rate: [0.005, 0.3] }

  CatBoost:
    사용: 아니오           # 설치 필요 (pip install catboost)
    설명: 부스팅 계열의 다른 구현
    표준화_필요: 아니오
    고정설정: { iterations: 300, verbose: 0 }
    좁은범위: { depth: [3, 5], learning_rate: [0.03, 0.1] }
    넓은범위: { depth: [2, 8], learning_rate: [0.005, 0.3] }

앙상블:
  사용: 예
  설명: 검증 상위 모델 3개의 증가 확률을 평균. 단일 모델을 모두 본 뒤 마지막 후보로 1회만 비교
  모델_수: 3


# ----------------------------------------------------------------
# 10. 하이퍼파라미터 탐색 방법
# ----------------------------------------------------------------
탐색:
  방법: grid               # grid = 좁은범위 조합을 전부 시험 (기본)
                           # optuna = 넓은범위 안에서 점수 좋은 쪽을 골라 시험 (설치 필요)
  optuna_모델당_시도: 30
  모델당_시간상한_분: 10   # optuna 일 때 모델 하나에 쓰는 시간 상한 (계획서 4-3)
  병렬_작업수: -1          # -1 = 컴퓨터의 모든 코어 사용


# ----------------------------------------------------------------
# 11. 에이전트 판단 규칙  (검증 데이터 과적합을 막는 장치)
#     새 레시피·모델은 아래 세 조건을 모두 넘어야 채택
# ----------------------------------------------------------------
판단규칙:
  부트스트랩_횟수: 1000      # 같은 검증 144문제를 무작위로 다시 뽑아 채점하는 횟수
  부트스트랩_승률: 0.9       # ① 그중 이 비율 이상에서 새 것이 나아야 함
  최소상승폭: 0.02           # ② 검증 3개월 합친 Macro-F1이 이만큼 이상 올라야 함
  최소상승월수: 2            # ③ 검증 3개월 중 이 개월 수 이상에서 올라야 함
  월별_비교_지표: 정답률     # ③을 무엇으로 볼지: 정답률 / macro_f1
  부트스트랩_단위: 문제       # ①에서 다시 뽑는 단위: 문제 / 달 (같은 달 문제끼리 함께 움직이면 '달'이 정직함. 진단이 정함)
                             #   macro_f1은 한 달 안에서 증가·감소를 섞어 맞혀야 점수가 나와, '그 달은 대부분 증가'처럼
                             #   달 전체 방향을 맞히는 방법을 3개월 합친 점수가 올라도 기각함 → 정답률 권장 (docs/0.7_탐색기록.md)
  수정_최대횟수: 3           # 학습·검증까지 간 수정 시도 횟수 상한 (10회로 늘렸을 때 검증 과적합이 실제로 나타나 3회 권장)


# ----------------------------------------------------------------
# 11-2. 진단  (검토 담당이 모델을 돌리기 전에 데이터 구조를 보고 평가 방식을 정함. 이후 실행 중에는 못 바꿈)
#        정하는 것: validation 달 수, 부트스트랩 단위(달/문제), test 채점 방식, 처음 레시피에 켤 파생변수, 뺄 후보 모델
#        진단에는 validation 마지막 달까지만 씀 (test 기간 정보 없음)
# ----------------------------------------------------------------
진단:
  사용: 예
  검증월_수_선택지: [3, 4, 5]   # validation 마지막 달(8월)에서 거꾸로 센 달 수 (5 = 4~8월, 첫 회차는 3월 한 달로 학습)
  달효과_기준: 0.2              # 규칙 모드: 정답 흔들림 중 '그 달 전체가 같이 움직인 몫'이 이 이상이면 validation 길게 + 달 단위 부트스트랩


# ----------------------------------------------------------------
# 12. 사전 점검  (모델에 넣기 전에 "할 만한가" 판단. 학습 기간 데이터만 사용)
# ----------------------------------------------------------------
사전점검:
  최소잔여비율: 0.2          # '제외' 묶음을 빼고 남은 금액이 원래의 이 비율보다 적은 칸이 있으면 탈락 (칸이 거의 비게 됨)
  최소변화비중: 0.005        # 묶음 금액이 전체의 이 비율(0.5%)보다 작으면 건너뜀
  최소신호: 0.05             # 새 변수의 AUC가 0.5에서 이만큼도 떨어져 있지 않으면 건너뜀
  최대상관: 0.95             # 새 변수가 기존 변수와 이보다 강하게 겹치면 건너뜀
  최대횟수: 20               # 사전 점검 시도 횟수 상한


# ----------------------------------------------------------------
# 13. 월별 갱신 실험  (계획서 5-3)
# ----------------------------------------------------------------
월별갱신:
  확장재학습_모델: [로지스틱회귀, 랜덤포레스트, LightGBM]   # 매달 누적 데이터로 다시 학습할 모델 (+ 최종 모델)
  지식손실_기준: 0.05        # 갱신 후 과거 구간 Macro-F1이 이만큼 떨어지면 대응 실험 실행


# ----------------------------------------------------------------
# 14. 평가 보고  (계획서 5-4)
# ----------------------------------------------------------------
평가:
  부트스트랩_횟수: 1000      # 테스트 점수의 95% 신뢰구간 계산용
  테스트_방식: 고정          # 고정 = 3~8월로 한 번 학습 / 매달재학습 = test 달마다 그때까지 확정된 정답으로 다시 학습
                             #   (진단을 켜면 검토 담당이 실행 시작 때 정함)


# ----------------------------------------------------------------
# 15. LLM 사용  (선택)
#     규칙 = LLM 없이 정해진 규칙으로 판단 (기본, 끝까지 실행됨)
#     ollama = 이 컴퓨터에서 도는 LLM (데이터가 밖으로 안 나감)
#     openai = OpenAI API (키는 여기 말고 저장소 최상위의 .env 파일에: OPENAI_API_KEY=sk-...)
#     LLM에게는 업종 이름·집계 통계·검증 점수·지역 코드만 보냄. 원본 행·지역 이름·테스트 점수는 보내지 않음
# ----------------------------------------------------------------
LLM:
  모드: 규칙
  ollama: { 주소: "http://localhost:11434/v1", 모델: "qwen2.5:7b" }
  openai: { 주소: "https://api.openai.com/v1", 모델: "gpt-4o-mini" }   # 아래 에이전트별_모델에 없으면 이 모델
  에이전트별_모델:           # openai 모드에서 에이전트마다 다른 모델 (판단이 중요한 곳은 큰 모델)
    원본: gpt-4o-mini
    계획: gpt-4.1
    데이터: gpt-4o-mini
    모델: gpt-4.1
    실행: gpt-4.1            # 테스트 해석이 보고서에 그대로 실리므로 정확한 모델 (작은 모델은 표를 잘못 읽은 사례가 있었음)
    검토: gpt-4.1
  시간초과_초: 120
  도구_호출_최대: 3
  에이전트별_대화유지: 예     # 예 = 에이전트마다 자기 이전 결정만 기억 (다른 에이전트 대화는 절대 안 섞음) / 아니오 = 매번 새로          # 결정 1번에 에이전트가 도구(집계 조회)를 부를 수 있는 횟수
  맡길_일:                   # 모드가 규칙이 아닐 때, LLM에게 맡길 일을 하나씩 켜고 끔 (아니오 = 그 일만 규칙으로)
    원본_해석: 예            # [0] 원본: 품질 점검 해석, 비소비성·본사집계 의심 소분류 후보 제안
    처음_레시피: 예          # [1] 계획: 처음 레시피 B에 켤 변수 고르기
    계획_검토: 예            # [5] 검토: 계획 담당의 B 제안을 검토해 승인하거나 고침
    모델_탐색_계획: 예       # [3] 모델: 탐색할 모델 계열과 범위 정하기, 1차 결과를 보고 범위 조정 (숫자는 탐색이 찾음)
    데이터_판단: 예          # [2] 데이터: 분해 변수 개수 정하기, 사전 점검 통과(🟢)한 수정안을 진행할지 판단 (🟡🔴는 못 뒤집음)
    수정안_고르기: 예        # [5] 검토: 다음에 시험할 수정안 고르기, 소분류 묶음 직접 만들기
    실행_판단: 예            # [4] 실행: 테스트 전 월별 갱신 실험 계획, 테스트 후 결과 해석 (다시 고르기 없음)
    결과_설명: 예            # [5] 검토: 보고서 맨 위 결과 해석 (테스트 점수는 안 보냄)
    진단: 예                 # [5] 검토: 모델을 돌리기 전 데이터 진단 → validation 길이·부트스트랩 단위·test 채점 방식·파생변수 결정
  기록:
    프롬프트_저장: 예        # 실제 보낸 프롬프트와 LLM 원문 응답을 runs/실행/llm/ 폴더에 파일로 저장
    화면_표시: 예            # 실행 화면에 LLM의 답을 한 줄씩 표시


