# 5. 기본 변수  (계획서 3-5)
#    모든 변수는 기준월 t까지의 값으로만 계산 (미래 정보 사용 금지)
#    처음값: 항상 = 늘 사용 / 끄기 = 처음엔 안 씀.  시험: 예 = 에이전트가 넣었다 뺐다 해 봄
# ----------------------------------------------------------------
변수:
  최근월_금액:       { 처음값: 항상, 시험: 아니오 }   # t월 결제금액
  최근월_건수:       { 처음값: 항상, 시험: 아니오 }   # t월 결제건수
  전월대비_차이:     { 처음값: 항상, 시험: 아니오 }   # t월 - (t-1)월 금액
  전월대비_증감률:   { 처음값: 항상, 시험: 아니오 }   # 차이 ÷ (t-1)월 금액 (전월 0원이면 0원여부 변수로 대체)
  최근3개월_평균:    { 처음값: 항상, 시험: 아니오 }
  최근3개월_변동성:  { 처음값: 항상, 시험: 아니오 }   # 표준편차 ÷ 평균
  최근_증감방향:     { 처음값: 항상, 시험: 아니오 }   # 지난달보다 늘었으면 1
  고객층_업종_구분:  { 처음값: 항상, 시험: 아니오 }   # 어느 고객층·업종인지 표시 (원-핫)
  객단가:            { 처음값: 끄기, 시험: 예 }       # 금액 ÷ 건수
  업종비중:          { 처음값: 끄기, 시험: 예 }       # 그 고객층 전체 지출 중 이 업종 비율
  달력변수:          { 처음값: 끄기, 시험: 예 }       # 다음 달 영업일 수, 명절, 소비쿠폰 기간 여부
  달력차이:          { 처음값: 끄기, 시험: 예 }       # 다음 달 − 이번 달: 일수·영업일수·휴일수·토일수·소비쿠폰 일수 차이
  일수보정:          { 처음값: 켜기, 시험: 예 }       # 하루평균 금액·하루평균 전월대비·다음 달 일수 차이 (월 합계의 날짜 수 효과 분리)
  칼만예측:          { 처음값: 켜기, 시험: 예 }       # 칼만 상태공간이 낸 다음 달 예상 변화 2개 (수준·공통요인). 기준월까지만 사용


